[package]
name = "nazca"
version = "0.3.0"
edition = "2024"
description = "A rendering library for geospatial data: interactive maps and layouts, native and wasm."
license = "MIT"
exclude = ["spike-web"]

[lib]
name = "nazca"
path = "src/lib.rs"

[features]
# The default build is standard-library only (project.org § DEPENDENCY
# POLICY). Each feature adds pure-Rust crates that build for
# wasm32-unknown-unknown unmodified.
gl = ["dep:glow", "dep:web-sys"]
# Vector tile decoders for basemaps, hand-written: no dependency.
mvt = []
mlt = []
# `Symbol::from_svg`: icons as SVG markup, rasterized by `resvg` and written
# back by the SVG writer as `usvg`'s rewrite (plans/custom-symbols.org § OPEN
# QUESTIONS 1 and 8).
symbols = ["dep:resvg", "dep:usvg"]

[dependencies]
# Nazca does not depend on `geosetta` or `geoscribe`, and as of geosetta 0.27.0
# and geoscribe 0.5.1 they do not depend on it: the three crates are peers that
# compose by piping text between their CLIs, or by a caller that links several
# of them (see ../../architecture.org).
glow = { version = "0.18.0", optional = true }
# Fonts off: an icon's text is dropped, so nazca reads no files and needs no
# font database. `raster-images` decodes a JPEG, GIF or WebP an icon embeds, so
# the screen draws what its markup does.
resvg = { version = "0.50.0", default-features = false, features = ["raster-images"], optional = true }
# `resvg`'s own, named for its writer, which `resvg` leaves off.
usvg = { version = "0.50.0", default-features = false, features = ["writer"], optional = true }

# The browser's WebGL2 context, which `gl::Context::from_webgl2` takes. Already
# in the tree through `glow`; named here so nazca's API need not name `glow`.
[target.'cfg(all(target_family = "wasm", not(target_os = "emscripten")))'.dependencies]
web-sys = { version = "0.3.100", optional = true, features = ["WebGl2RenderingContext"] }

# Reads the MLT conformance fixtures' expected GeoJSON in tests.
[dev-dependencies]
serde_json = "1"

# The native spike example's window and GL context, and its --screenshot
# output. Never needed by the library; not built for wasm targets.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glutin = "0.32.3"
glutin-winit = "0.5.0"
winit = "0.30.13"
raw-window-handle = "0.6.2"
png = "0.18.1"
# The spike's own GL binding for --own-gl, as an embedder with GL calls of its
# own keeps one beside nazca's context.
glow = "0.18.0"

[[test]]
name = "vector_tiles"
required-features = ["mvt", "mlt"]

[[example]]
name = "layout"
required-features = ["mlt"]

[[example]]
name = "spike"
required-features = ["gl", "symbols"]
