[package]
name = "nazca"
version = "0.2.0"
edition = "2024"
description = "A rendering library for geospatial data: interactive maps and layouts, native and wasm."
license = "MIT"
exclude = ["spike-web"]

[lib]
name = "nazca"
path = "src/lib.rs"

[features]
# The default build is standard-library only (project.org § DEPENDENCY
# POLICY). Each feature adds pure-Rust crates that build for
# wasm32-unknown-unknown unmodified.
gl = ["dep:glow"]
# Vector tile decoders for basemaps, hand-written: no dependency.
mvt = []
mlt = []

[dependencies]
# Nazca does not depend on `geosetta` or `geoscribe`, and as of geosetta 0.27.0
# and geoscribe 0.5.1 they do not depend on it: the three crates are peers that
# compose by piping text between their CLIs, or by a caller that links several
# of them (see ../../architecture.org).
glow = { version = "0.18.0", optional = true }

# Reads the MLT conformance fixtures' expected GeoJSON in tests.
[dev-dependencies]
serde_json = "1"

# The native spike example's window and GL context, and its --screenshot
# output. Never needed by the library; not built for wasm targets.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
glutin = "0.32.3"
glutin-winit = "0.5.0"
winit = "0.30.13"
raw-window-handle = "0.6.2"
png = "0.18.1"

[[test]]
name = "vector_tiles"
required-features = ["mvt", "mlt"]

[[example]]
name = "layout"
required-features = ["mlt"]

[[example]]
name = "spike"
required-features = ["gl"]
